# Builds Achroite's native packages on the two systems they are made for: an installer and a
# portable zip on Windows, a .deb and a portable tar.gz on Linux. jpackage cannot build for
# another system, so each is built on its own. The packages are kept as the run's artifacts,
# to download and try.
name: Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the code, nothing more: the packages are kept as the run's artifacts, which needs no
# write access to the repository.
permissions:
  contents: read

jobs:
  package:
    strategy:
      # One system failing should not stop the other: both results are worth seeing.
      fail-fast: false
      matrix:
        # Pinned, not -latest, so a new runner image never changes a package unannounced.
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Each action is pinned to a commit, not a tag: a tag can be moved to other code by
      # whoever controls it, a commit cannot. Dependabot proposes updates. The checkout
      # keeps no token behind, since nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temurin 25, the JDK the POM compiles for. Its jpackage builds the packages, and its
      # jlink cuts the runtime they carry.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The tests run on each system, so a failure only Windows shows turns up here.
      - name: Test and package the jar
        run: mvn --batch-mode verify

      # Git Bash on Windows, so one script serves both. The Windows installer needs WiX 3,
      # which the windows-2025 image has.
      - name: Build the native packages
        shell: bash
        run: bash elbaite-chip8/packaging/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ runner.os }}
          path: elbaite-chip8/target/packages/
          if-no-files-found: error
