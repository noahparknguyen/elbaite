# The check that has to stay green: every test passes and the jar still builds.
# `mvn verify` runs the same thing locally; this is the part that doesn't depend
# on anyone remembering to.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    # Pinned, not -latest, so a new runner image never changes the check unannounced.
    runs-on: ubuntu-24.04
    steps:
      # Each action is pinned to a commit, not a tag: a tag can be moved to other code by
      # whoever controls it, a commit cannot. Dependabot proposes updates. The checkout
      # keeps no token behind, since nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temurin 25, the JDK the POM compiles for (maven.compiler.release 25).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Compiles, runs every test, then packages the jar, so a change that breaks
      # the build or the manifest fails here as well as one that breaks a test.
      # The runner has no display and no sound device, and the tests need
      # neither: Surefire runs them headless, and none of them opens an audio line.
      - name: Test and package
        run: mvn --batch-mode verify
