# The Maven that mvnw and mvnw.cmd download and run, so the build needs only Java. The
# checksum is the zip's SHA-256: the wrapper refuses a download that does not match it. It was
# taken from the zip after its SHA-512 matched both Maven Central's and Apache's, and its
# signature checked against Apache's published Maven keys. From 3.10, builds are reproducible
# by default: the same source gives byte-identical jars.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
distributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff
