# The Maven that mvnw and mvnw.cmd download and run, so the build needs only Java. The
# checksum is the zip's SHA-256: the wrapper refuses a download that does not match it. It was
# taken from the zip after its SHA-512 matched both Maven Central's and Apache's, and its
# signature checked against Apache's published Maven keys.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
